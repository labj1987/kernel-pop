name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Every action is pinned to a full commit SHA: a tag such as `v3` can be moved to other
      # code, a SHA cannot. The trailing comment names the release the SHA is; the weekly
      # maintenance round updates them (see .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Toolchain matches rust-toolchain.toml
        run: grep -q '^channel = "1.96.0"$' rust-toolchain.toml && rustc --version | grep -q '^rustc 1\.96\.0 '
      # A failed index refresh fails the job: a stale index could install other versions, or
      # leave a test tool out so its tests are skipped.
      - name: Install GTK4 / libadwaita headers
        run: |
          sudo apt-get update -qq
          # gnupg/gpgv: the tarball signature tests make a throwaway key and run gpgv;
          # xz-utils/gzip: the tarball tests compress with them.
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev pkg-config gnupg gpgv xz-utils gzip
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check
        run: |
          bash -n scripts/privileged-install.sh
          bash -n build-appimage.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          # sbsigntool/openssl and an EFI binary (systemd-boot-efi) let the
          # signing tests run.
          sudo apt-get install -y -qq shellcheck sbsigntool openssl systemd-boot-efi
          shellcheck -S warning scripts/privileged-install.sh scripts/tests/test-privileged.sh build-appimage.sh
      # KERNEL_POP_REQUIRE_ALL_TESTS turns every skipped test group into a failure.
      - name: Privileged-script helper tests
        run: KERNEL_POP_REQUIRE_ALL_TESTS=1 bash scripts/tests/test-privileged.sh
      - name: AppStream releases match the changelog
        run: python3 scripts/sync_appdata_releases.py --check && python3 scripts/release_notes.py --self-test && python3 scripts/release_notes.py "$(grep -m1 '^version' Cargo.toml | cut -d\" -f2)" > /dev/null
