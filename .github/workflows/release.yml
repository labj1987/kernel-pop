name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        run: |
          cargo_ver="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_NAME}" != "v${cargo_ver}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${cargo_ver}" >&2
            exit 1
          fi
          if ! grep -q "<release version=\"${cargo_ver}\"" data/io.github.labj1987.KernelPop.appdata.xml; then
            echo "appdata.xml has no <release> entry for ${cargo_ver}" >&2
            exit 1
          fi

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev pkg-config libssl-dev
          cargo test --locked

      - name: Build AppImage
        run: sudo -E env "PATH=$PATH" bash build-appimage.sh

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: kernelpop-*-x86_64.AppImage*
          generate_release_notes: true
